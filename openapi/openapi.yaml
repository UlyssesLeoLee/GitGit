openapi: 3.1.0
info:
  title: GitGit Platform API
  description: |
    AI-Native Engineering Platform 对外 API。
    详细设计：docs/design/basic-design/11-api-design.md + docs/design/detailed-design/08-api-handlers.md
    实施前 QA：QA-018 (MCP 客户端兼容) / QA-021 (Admin 鉴权域)
  version: 0.1.0
  contact:
    name: GitGit Team
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://{tenant}.gitgit.example.com/api/v1
    description: Cloud
    variables:
      tenant:
        default: acme

security:
  - bearerAuth: []

tags:
  - name: repositories
    description: Git 仓库管理 (GIT-REQ)
  - name: graph
    description: 图谱 5 原语操作
  - name: events
    description: 事件流查询与订阅
  - name: policies
    description: 策略管理
  - name: agents
    description: Agent 运行 (AGT-REQ)
  - name: apps
    description: App 插件管理
  - name: mcp
    description: MCP tool surface
  - name: admin
    description: Admin 运维（独立鉴权域，端口 3001）

paths:
  /healthz:
    get:
      tags: [repositories]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Healthy

  /readyz:
    get:
      tags: [repositories]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Ready

  /repos:
    get:
      tags: [repositories]
      summary: List repositories
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoList'

    post:
      tags: [repositories]
      summary: Create repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'

  /repos/{repo_id}:
    get:
      tags: [repositories]
      summary: Get repository
      parameters:
        - name: repo_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'
        '404':
          $ref: '#/components/responses/NotFound'

  /graph/nodes:
    post:
      tags: [graph]
      summary: Create a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'

  /graph/nodes/{node_id}:
    get:
      tags: [graph]
      summary: Get a node
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NotFound'

  /graph/traverse:
    post:
      tags: [graph]
      summary: Traverse graph from a starting node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraverseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraverseResponse'

  /events:
    get:
      tags: [events]
      summary: Query events
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'

  /policies/evaluate:
    post:
      tags: [policies]
      summary: Evaluate a policy decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecision'

  /agents/runs:
    post:
      tags: [agents]
      summary: Start an agent run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStart'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'

  /agents/runs/{run_id}/approve:
    post:
      tags: [agents]
      summary: Approve or reject an agent run (AGT-REQ-002)
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentApprove'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'

  /apps:
    get:
      tags: [apps]
      summary: List installed apps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppList'

    post:
      tags: [apps]
      summary: Install a new app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInstall'
      responses:
        '201':
          description: Installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'

  /apps/{app_id}/upgrade:
    post:
      tags: [apps]
      summary: Upgrade an app
      parameters:
        - name: app_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpgrade'
      responses:
        '200':
          description: OK

  /mcp/tools:
    get:
      tags: [mcp]
      summary: List MCP tools
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPToolList'

  /mcp/tools/invoke:
    post:
      tags: [mcp]
      summary: Invoke an MCP tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPInvokeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPInvokeResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearerAuth:
      type: http
      scheme: bearer
      description: Admin 独立鉴权域

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimit:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: '错误代码 (见 §11-error-handling.md)' }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    Repo:
      type: object
      required: [id, namespace, name, default_branch, created_at]
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string, example: 'org/repo' }
        name: { type: string }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [public, private, internal] }
        default_branch: { type: string }
        lfs_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pushed_at: { type: string, format: date-time, nullable: true }

    RepoCreate:
      type: object
      required: [namespace, name]
      properties:
        namespace: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public, private, internal], default: private }
        default_branch: { type: string, default: main }
        lfs_enabled: { type: boolean, default: false }

    RepoList:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Repo' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    Node:
      type: object
      required: [id, type, data, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: 'Repository' }
        subtype: { type: string, nullable: true }
        schema_version: { type: integer, default: 1 }
        data: { type: object, additionalProperties: true }
        epistemic_status: { type: string, nullable: true, description: 'GRF-REQ-010 认识论状态' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NodeCreate:
      type: object
      required: [type, data]
      properties:
        type: { type: string }
        subtype: { type: string }
        data: { type: object, additionalProperties: true }
        correlation_id: { type: string, format: uuid, nullable: true }

    TraverseRequest:
      type: object
      required: [start_id, direction]
      properties:
        start_id: { type: string, format: uuid }
        direction: { type: string, enum: [out, in, both] }
        edge_types:
          type: array
          items: { type: string }
        max_depth: { type: integer, default: 3, maximum: 10 }

    TraverseResponse:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/Edge' }

    Edge:
      type: object
      properties:
        id: { type: string, format: uuid }
        src_id: { type: string, format: uuid }
        dst_id: { type: string, format: uuid }
        type: { type: string }
        data: { type: object }

    EventList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor: { type: string, nullable: true }
    Event:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        actor_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid, nullable: true }
        data: { type: object }
        created_at: { type: string, format: date-time }

    PolicyInput:
      type: object
      required: [subject_id, action, resource_type]
      properties:
        subject_id: { type: string, format: uuid }
        subject_type: { type: string, enum: [user, agent, service] }
        action: { type: string, example: 'repo.write' }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        context:
          type: object
          additionalProperties: { type: string }

    PolicyDecision:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reason: { type: string, nullable: true }
        matched_policies:
          type: array
          items: { type: string }

    AgentStart:
      type: object
      required: [agent_id, input]
      properties:
        agent_id: { type: string, format: uuid }
        input: { type: object }
        parent_run_id: { type: string, format: uuid, nullable: true }
    AgentApprove:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        comment: { type: string, nullable: true }
    AgentRun:
      type: object
      required: [id, agent_id, state]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, running, awaiting_approval, completed, failed] }
        input: { type: object }
        output: { type: object, nullable: true }
        error: { type: object, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        correlation_id: { type: string, format: uuid, nullable: true }

    App:
      type: object
      required: [id, manifest_version, status]
      properties:
        id: { type: string }
        manifest_version: { type: string, description: 'semver' }
        status: { type: string, enum: [installed, enabled, disabled, upgrading, failed] }
        db_role: { type: string }
        db_schema: { type: string }
        installed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AppList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/App' }
    AppInstall:
      type: object
      required: [manifest, manifest_version]
      properties:
        manifest: { type: object, description: 'app.yaml 内容' }
        manifest_version: { type: string }
    AppUpgrade:
      type: object
      required: [manifest_version]
      properties:
        manifest_version: { type: string }
        strategy: { type: string, enum: [rolling, blue_green, canary], default: rolling }

    MCPTool:
      type: object
      required: [name, description, input_schema]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema: { type: object, description: 'JSON Schema' }
    MCPToolList:
      type: object
      properties:
        tools:
          type: array
          items: { $ref: '#/components/schemas/MCPTool' }
    MCPInvokeRequest:
      type: object
      required: [name, arguments]
      properties:
        name: { type: string }
        arguments: { type: object }
        correlation_id: { type: string, format: uuid, nullable: true }
    MCPInvokeResponse:
      type: object
      required: [content]
      properties:
        content: { type: object }
        is_error: { type: boolean, default: false }
