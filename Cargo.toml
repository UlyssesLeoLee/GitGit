# gitgit — single-crate MVP for a local Git HTTP server.
# See README.md for the design context.
# This is intentionally a single crate, NOT a workspace. The previous 14-crate
# design is archived in docs_archive_rust_impl_2026_08_26/.

[package]
name = "gitgit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

[[bin]]
name = "gitgit"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower = "0.5"
url = "2"
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1.4"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
bytes = "1.7"
http = "1.1"
http-body-util = "0.1"
futures-util = "0.3"
# V0 Credential Vault (per ADR-0021): rust-s3 is the S3-compatible client
# (originally published as `s3`; renamed to `rust-s3` on crates.io after
# the `s3` namespace was reclaimed by an unrelated lean client).
# Import path is still `use s3::...` per the crate's lib.rs.
# Feature: `tokio-rustls-tls` is pure-Rust TLS via reqwest+rustls,
# matching the brief's "no native deps" intent.
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
# V0 Credential Vault version-management API (per ADR-0022): the
# sidecar metadata hashes each version's bytes; sha2 + hex are the
# minimal pair of crates to produce 64-char lowercase digests without
# pulling in a crypto framework.
sha2 = "0.10"
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
