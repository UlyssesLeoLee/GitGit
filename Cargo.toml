# gitgit — single-crate MVP for a local Git HTTP server.
# See README.md for the design context.
# This is intentionally a single crate, NOT a workspace. The previous 14-crate
# design is archived in docs_archive_rust_impl_2026_08_26/.

[package]
name = "gitgit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

[[bin]]
name = "gitgit"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower = "0.5"
url = "2"
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1.4"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
bytes = "1.7"
http = "1.1"
http-body-util = "0.1"
futures-util = "0.3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
