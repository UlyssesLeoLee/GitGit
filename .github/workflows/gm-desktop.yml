# gm-desktop CI — the Tauri 2 + Svelte 5 desktop shell.
#
# This app had NO workflow until now: neither `rust-backend.yml` nor
# `gm-console.yml` lists `apps/gm-desktop/**` in its `paths`, so desktop
# changes were invisible to CI. That gap is what hid a long-standing
# production build failure (see the note on the cargo step below).
#
# Two jobs, deliberately split by cost:
#
#   `build` (ubuntu-latest) is the *lightweight* gate: lint, svelte-check,
#   unit tests, the Vite production build, and the Rust fmt/clippy/test
#   gates on the Tauri backend. It never bundles.
#
#   `msi` (windows-latest) is the *installer* gate: it runs a real release
#   `tauri build` for BOTH install scopes, proves the two .msi files coexist
#   instead of overwriting each other, smoke-checks them without installing
#   anything, and uploads one artifact per scope. It needs Windows and a WiX
#   toolchain, and it costs minutes rather than seconds, so it is not folded
#   into `build`. See `.github/CI.md` "已知限制".
#
# Between them they cover what neither `rust-backend.yml` nor
# `gm-console.yml` can: neither lists `apps/gm-desktop/**` in its `paths`, so
# before this file existed desktop changes were invisible to CI. That gap is
# what hid a long-standing production build failure (see the note on the
# cargo step below).
name: gm-desktop

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/gm-desktop/**'
      - '.github/workflows/gm-desktop.yml'
      # The desktop crate consumes the root crate by path
      # (`gitgit = { path = "../../.." }`), so a change to the root manifest
      # or lockfile can break the `--locked` cargo steps in this workflow.
      # Omitting these from the filter is what let a stale
      # `src-tauri/Cargo.lock` break this job for a full day without CI
      # noticing: the breakage was introduced by a commit that touched only
      # root `Cargo.toml` + `Cargo.lock`, so this workflow never ran.
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/gm-desktop/**'
      - '.github/workflows/gm-desktop.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: gm-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + check + test + build + cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/gm-desktop
    steps:
      - uses: actions/checkout@v4

      # pnpm MUST be installed before setup-node. With `cache: 'pnpm'`,
      # setup-node shells out to `pnpm store path` to resolve the cache
      # directory; installing pnpm afterwards makes that step fail. This
      # is the same ordering bug that used to keep gm-console red — see the
      # comment in gm-console.yml.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 22, not 20: Node 20 ("Iron") reached EOL on 2026-04-30, and
      # `@testing-library/jest-dom@6.x` declares `engines.node: ">=22"`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Svelte check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      # The thresholds in `vite.config.ts` were declared for a long time
      # and read as a gate, but nothing ever evaluated them: the step
      # above is `vitest run` without `--coverage`. As of 2026-10-05 the
      # suite clears all four (measured 94.78% lines / 94.23% statements
      # / 95.17% functions / 78.43% branches, against 70/70/60/55), so
      # the declaration is now actually enforced.
      #
      # It is a separate step rather than `--coverage` on the step above
      # so the suite is not run twice. And the guard is fail-closed: the
      # coverage reporter's own `text` output is not proof that tests ran,
      # because a filtered run matching zero files exits 0 and prints a
      # table. This asserts the run reported real work.
      #
      # `[FACT]` The ANSI stripping is not decoration, and the first
      # version of this step failed on CI because of it. Vitest colours
      # its output when `CI` is set, so the captured line is
      #
      #     ESC[2m      Tests ESC[22m ESC[1mESC[32m378 passedESC[39m...
      #
      # and a `Tests +[1-9][0-9]* passed` pattern cannot match across
      # those escape sequences. It matched locally and failed on the
      # runner, which is the whole argument for running a gate under the
      # conditions it will actually run in. Measured locally by forcing
      # `CI=true` and colour on.
      - name: Coverage gate
        run: |
          pnpm test:coverage 2>&1 | tee /tmp/gmd-coverage.txt
          sed 's/\x1b\[[0-9;]*m//g' /tmp/gmd-coverage.txt > /tmp/gmd-coverage.plain.txt
          # `[FACT]` vitest prints `Tests  378 passed (378)`. A run that
          # matched zero test files prints no such line.
          if ! grep -qE 'Tests +[1-9][0-9]* passed' /tmp/gmd-coverage.plain.txt; then
            echo "::error::the coverage run reported no passing tests, so its table proves nothing"
            tail -40 /tmp/gmd-coverage.plain.txt
            exit 1
          fi

      - name: Build
        run: pnpm build

      # NOTE: no `working-directory` here — that key is only valid on `run:`
      # steps, and the job-level default already points at apps/gm-desktop.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri 2 on Linux needs the WebKitGTK / GTK stack for its build
      # script to resolve pkg-config. This is Tauri's documented Linux
      # prerequisite set, not an arbitrary extra. `patchelf` is required
      # by the bundler; we keep it here so the step stays valid if a full
      # `tauri build` is added later.
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # `cargo fmt --all -- --check`: the sibling crate `rust-backend.yml`
      # gates on this, and `src-tauri` had accumulated 44 formatting
      # hunks across 8 files purely because nothing ever ran it. Formatting
      # is not cosmetic debt here — it is what makes a 130-line diff
      # reviewable, and this gate is what keeps the next one small.
      - name: Rust format (src-tauri)
        working-directory: apps/gm-desktop/src-tauri
        run: cargo fmt --all -- --check

      # `cargo clippy`, not a bare `cargo check`: clippy runs the same
      # compile, so it replaces check rather than adding to it, and it is
      # the only thing that would have caught the 20 clippy errors and 14
      # warnings that were sitting in `src-tauri` before this step
      # existed. `-D warnings` matches the gate in `rust-backend.yml`.
      #
      # `--all-targets` is required: the default `cargo clippy` lints
      # only the lib, and every test in this crate lives in `#[cfg(test)]`
      # modules that a lib-only run never sees.
      - name: Clippy (deny warnings)
        working-directory: apps/gm-desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # `ServerManager` had zero coverage, which is why `stop()` could
      # report `running: false` while `axum::serve` kept the port bound:
      # dropping a tokio `JoinHandle` detaches the task instead of
      # cancelling it. The regression tests for that live in
      # `state.rs` and cannot run unless a workflow runs them.
      #
      # `--lib` rather than `--all-targets`: the tests are all in the
      # lib target, and the bin target is the full Tauri executable,
      # which this job has no reason to link a second time. The guard
      # below is what keeps "0 tests ran" from reading as green.
      - name: Rust unit tests (src-tauri)
        working-directory: apps/gm-desktop/src-tauri
        run: |
          cargo test --locked --lib 2>&1 | tee /tmp/gm-desktop-cargo-test.txt
          # `cargo test` exits 0 even when every target ran zero tests, so
          # a refactor that moved the tests out of the compiled target
          # set would turn this step green while testing nothing.
          if ! grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/gm-desktop-cargo-test.txt; then
            echo "::error::src-tauri ran zero Rust tests (or failed) — refusing to pass"
            exit 1
          fi

      - name: Upload Rust test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-cargo-test-log
          path: /tmp/gm-desktop-cargo-test.txt
          retention-days: 7

      - name: Upload web bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-dist
          path: apps/gm-desktop/dist/
          retention-days: 14

  # The installer gate. Separate from `build` on purpose: `build` is the
  # fast Linux lint/test gate and runs on every change, while a full release
  # `tauri build` needs a Windows runner and a WiX toolchain and costs
  # minutes, so it is its own job with its own timeout rather than a step
  # bolted onto the end of `build`.
  #
  # What this job exists to catch: the Tauri bundler names an MSI
  # {productName}_{version}_{arch}_{lang}.msi, which carries no install
  # scope, so a per-user and a per-machine build of the same version and
  # language land on the SAME path and the second silently overwrites the
  # first with exit code 0. build-msi.ps1 moves each artifact out of the
  # shared bundle directory under a scope-qualified name; this job proves
  # both variants survive that, and uploads them separately.
  msi:
    name: msi (per-user + per-machine)
    runs-on: windows-latest
    timeout-minutes: 45

    # No job-level `defaults.run.working-directory` here, unlike `build`: the
    # steps below address repo-root paths (apps/gm-desktop/scripts/...) and
    # upload paths, so an implicit working directory would only be one more
    # thing to get wrong.
    steps:
      - uses: actions/checkout@v4

      # Same ordering constraint as the `build` job: pnpm before setup-node,
      # because setup-node shells out to `pnpm store path` for the cache.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      # No `components:` needed: nothing here runs rustfmt or clippy, and the
      # msvc host toolchain is what `tauri build` needs on Windows.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A cold release build of this crate tree plus two bundler runs. Shelled
      # out to `pwsh -File` rather than invoked with `&` so the script's exit
      # code lands in $LASTEXITCODE and the explicit check below is live code:
      # a `pwsh -command` step that only runs a failing native command would
      # otherwise still report the step as passed.
      - name: Build both MSI variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./apps/gm-desktop/scripts/build-msi.ps1 -Scope both -OutputDir msi-out
          if ($LASTEXITCODE -ne 0) { throw "build-msi.ps1 exited $LASTEXITCODE" }

      # Neither an install nor elevation: `msiexec /a` lays the file table out
      # into a temp directory, and the MSI tables are read through Windows
      # Installer COM automation, so this asserts real payload and real scope
      # on a stock runner.
      - name: Smoke check the MSIs (no install, no elevation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./apps/gm-desktop/scripts/verify-msi.ps1 -Dir msi-out
          if ($LASTEXITCODE -ne 0) { throw "verify-msi.ps1 exited $LASTEXITCODE" }

      # The version comes from the manifest build-msi.ps1 wrote, so the
      # artifact names cannot drift from what was actually built. A missing or
      # unparseable manifest fails here rather than silently yielding
      # artifact names with an empty version.
      - name: Read variant metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $PWD 'msi-out/manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "manifest not found: $manifestPath" }
          $m = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          "version=$($m.version)"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "variants=$(@($m.variants).Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # One artifact per scope, and `if-no-files-found: error` on both: with the
      # default 'warn', a glob that matches nothing leaves a green job with no
      # installer at all, which is the same class of failure as the collision
      # this job exists to prevent. The scope token in the name is what makes
      # the two uploads distinct.
      - name: Upload perMachine MSI
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-msi-${{ steps.meta.outputs.version }}-perMachine
          path: msi-out/*_perMachine_*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload perUser MSI
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-msi-${{ steps.meta.outputs.version }}-perUser
          path: msi-out/*_perUser_*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload variant manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-msi-${{ steps.meta.outputs.version }}-manifest
          path: msi-out/manifest.json
          if-no-files-found: error
          retention-days: 14

      # Uploaded on failure too, so a red installer job is diagnosable without
      # re-running it. `if: always()` is safe here: the step fails loudly if
      # the artifacts are absent, and on a build failure the job is already
      # red, so nothing is being hidden.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-msi-build-log
          path: |
            msi-out/manifest.json
            apps/gm-desktop/src-tauri/target/release/bundle/msi/
          if-no-files-found: ignore
          retention-days: 7
