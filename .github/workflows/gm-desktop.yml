# gm-desktop CI — the Tauri 2 + Svelte 5 desktop shell.
#
# This app had NO workflow until now: neither `rust-backend.yml` nor
# `gm-console.yml` lists `apps/gm-desktop/**` in its `paths`, so desktop
# changes were invisible to CI. That gap is what hid a long-standing
# production build failure (see the note on the cargo step below).
#
# Scope is deliberately the *lightweight* gate: lint, svelte-check, unit
# tests, the Vite production build, and a `cargo check` of the Tauri
# backend. A full `tauri build` / `.msi` / `tauri-action` is NOT run here —
# it needs a full bundling toolchain and multi-OS matrix. See
# `.github/CI.md` "已知限制".
name: gm-desktop

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/gm-desktop/**'
      - '.github/workflows/gm-desktop.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/gm-desktop/**'
      - '.github/workflows/gm-desktop.yml'

concurrency:
  group: gm-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + check + test + build + cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/gm-desktop
    steps:
      - uses: actions/checkout@v4

      # pnpm MUST be installed before setup-node. With `cache: 'pnpm'`,
      # setup-node shells out to `pnpm store path` to resolve the cache
      # directory; installing pnpm afterwards makes that step fail. This
      # is the same ordering bug that used to keep gm-console red — see the
      # comment in gm-console.yml.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 22, not 20: Node 20 ("Iron") reached EOL on 2026-04-30, and
      # `@testing-library/jest-dom@6.x` declares `engines.node: ">=22"`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Svelte check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # NOTE: no `working-directory` here — that key is only valid on `run:`
      # steps, and the job-level default already points at apps/gm-desktop.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri 2 on Linux needs the WebKitGTK / GTK stack for its build
      # script to resolve pkg-config. This is Tauri's documented Linux
      # prerequisite set, not an arbitrary extra. `patchelf` is required
      # by the bundler; we keep it here so the step stays valid if a full
      # `tauri build` is added later.
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # `cargo clippy`, not a bare `cargo check`: clippy runs the same
      # compile, so it replaces check rather than adding to it, and it is
      # the only thing that would have caught the 20 clippy errors and 14
      # warnings that were sitting in `src-tauri` before this step
      # existed. `-D warnings` matches the gate in `rust-backend.yml`.
      #
      # `--all-targets` is required: the default `cargo clippy` lints
      # only the lib, and every test in this crate lives in `#[cfg(test)]`
      # modules that a lib-only run never sees.
      - name: Clippy (deny warnings)
        working-directory: apps/gm-desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # `ServerManager` had zero coverage, which is why `stop()` could
      # report `running: false` while `axum::serve` kept the port bound:
      # dropping a tokio `JoinHandle` detaches the task instead of
      # cancelling it. The regression tests for that live in
      # `state.rs` and cannot run unless a workflow runs them.
      #
      # `--lib` rather than `--all-targets`: the tests are all in the
      # lib target, and the bin target is the full Tauri executable,
      # which this job has no reason to link a second time. The guard
      # below is what keeps "0 tests ran" from reading as green.
      - name: Rust unit tests (src-tauri)
        working-directory: apps/gm-desktop/src-tauri
        run: |
          cargo test --locked --lib 2>&1 | tee /tmp/gm-desktop-cargo-test.txt
          # `cargo test` exits 0 even when every target ran zero tests, so
          # a refactor that moved the tests out of the compiled target
          # set would turn this step green while testing nothing.
          if ! grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/gm-desktop-cargo-test.txt; then
            echo "::error::src-tauri ran zero Rust tests (or failed) — refusing to pass"
            exit 1
          fi

      - name: Upload Rust test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-cargo-test-log
          path: /tmp/gm-desktop-cargo-test.txt
          retention-days: 7

      - name: Upload web bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-dist
          path: apps/gm-desktop/dist/
          retention-days: 14
