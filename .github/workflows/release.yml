# Tag-triggered release build.
#
# WHAT THIS IS, PRECISELY
# =======================
# Pushing a `v*` tag builds the four desktop targets and attaches them to a
# **draft** GitHub Release. A draft is not public: it is visible only to
# collaborators until someone presses "Publish". That is the whole point of
# this file at its current stage — it proves the tag → build → artifact →
# release path works, without committing the project to a public release
# it is not ready for.
#
# WHY IT REPEATS FOUR `tauri build` INVOCATIONS
# ==============================================
# The obvious alternative is to make `gm-desktop-bundle.yml` reusable
# (`workflow_call`) and call it. That was the first design here, and
# checking it rather than assuming it changed the answer:
#
#   [FACT] `gm-desktop-bundle.yml` has no `workflow_call` trigger today.
#   [FACT] It carries a `paths:` filter, which has no meaning for a
#   reusable call, and a `concurrency:` group keyed on `github.ref` — and
#   GitHub resolves `github.ref` differently inside a called workflow,
#   so that group would have to be reworked too.
#
# So reuse would have meant editing a 540-line workflow that has been
# green across every run so far, in order to save four one-line
# `tauri build` commands. The drift risk that motivated reuse is real but
# small at this size, and the verification is not duplicated at all: both
# files call the same `scripts/verify-bundle.sh` and
# `scripts/verify-msi.ps1`, so an artifact that passes here passed the
# same checks CI runs. What is duplicated is the *build invocation*, not
# the *definition of correct*.
#
# If the bundle workflow ever gains a `workflow_call` trigger, this file
# should collapse to a single `uses:` and drop its four build jobs.
#
# WHAT IT DELIBERATELY DOES NOT DO
# ================================
# No signing, no notarization, no auto-updater manifest. All four MSI
# variants and the .dmg are unsigned (see README "已知未决问题"), and
# `tauri-plugin-updater` is not registered in `lib.rs`. A release that
# produced a `latest.json` would advertise an update channel that no
# install can actually use.
#
# TAGGING RULES, AND WHY THEY ARE ENFORCED
# =========================================
# The tag's version must equal the version in `tauri.conf.json`. Without
# that check, `git tag v1.0.0` on a tree whose config says `0.1.0` produces
# a release named 1.0.0 containing a 0.1.0 build, and the mismatch is only
# discoverable by a user who downloads it. The check runs before any
# building, so a mistyped tag costs seconds rather than a 15-minute job.
name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs are how this gets exercised before a tag is trusted. The
  # version check still applies, so a manual run on a mismatched tree is
  # red for the same reason a tagged run would be.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist and match tauri.conf.json)'
        required: true
        type: string

permissions:
  contents: write  # required to create a draft release and upload assets

concurrency:
  group: release-${{ github.ref }}
  # A tag push is rare and deliberate. Cancelling one in flight would leave
  # a half-populated draft release behind, which is worse than waiting.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — cheap, and it runs before any runner time is spent
  # ---------------------------------------------------------------------------
  verify-tag:
    name: verify the tag matches the declared version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        # Both values arrive through `env:`, never pasted into the script
        # body with `${{ }}`. Two reasons, and the second one is why this
        # workflow failed on its first real run:
        #
        #   1. `inputs.tag` is operator-supplied text. Interpolated into a
        #      script body it becomes code, not data.
        #   2. A `run:` block is its own process. Whatever this step
        #      assigns is gone when the next step starts, which is how
        #      `ref` came to be unbound downstream (see the note on the
        #      step below).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # On `workflow_dispatch` there is no tag in the ref, so the name
          # comes from the input. On a tag push it is the ref itself.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ref="$INPUT_TAG"
          else
            ref="${GITHUB_REF#refs/tags/}"
          fi
          case "$ref" in
            v*) ;;
            *) echo "::error::'$ref' is not a v-prefixed tag"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "building $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare against tauri.conf.json
        id: check
        # `ref` is handed over as an `env:` value, because the shell
        # variable the previous step assigned does not survive into this
        # one. Reading it here as a bare `$ref` is what made the first real
        # run of this workflow exit 1 with no `::error::` line at all:
        # `set -u` killed the step on `ref: unbound variable` before any of
        # the guarded branches below could run. Nothing was wrong with the
        # tag, and the workflow reported that by reporting nothing.
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          declared=$(jq -r '.version' apps/gm-desktop/src-tauri/tauri.conf.json)
          if [ -z "$declared" ] || [ "$declared" = "null" ]; then
            echo "::error::tauri.conf.json records no version; the tag cannot be checked"
            exit 1
          fi
          tagged="${REF#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag is $tagged but apps/gm-desktop/src-tauri/tauri.conf.json says $declared"
            echo "A release named $tagged containing a $declared build is a lie a user has to discover."
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "tag $REF matches tauri.conf.json ($declared)" >> "$GITHUB_STEP_SUMMARY"

      # The other two places the same number is written. A release job that
      # only checked one of three would still let a stale `Cargo.toml`
      # version into the binary.
      - name: The other two version declarations agree too
        run: |
          set -euo pipefail
          v="${{ steps.check.outputs.version }}"
          for f in apps/gm-desktop/package.json Cargo.toml; do
            if [ "$f" = "Cargo.toml" ]; then
              got=$(sed -n '/^\[package\]$/,/^\[/p' "$f" | sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -1)
            else
              got=$(jq -r '.version' "$f")
            fi
            if [ "$got" != "$v" ]; then
              echo "::error::$f declares $got, expected $v"
              exit 1
            fi
          done
          echo "all three version declarations agree ($v)"

  # ---------------------------------------------------------------------------
  # Build the four targets by calling the existing bundle workflow
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Build the four targets
  #
  # Each job calls the SAME verification script the ordinary bundle
  # workflow calls, so an artifact accepted here was checked by the same
  # rules CI applies. Only the build invocation is repeated, not the
  # definition of correct.
  # ---------------------------------------------------------------------------
  dmg:
    name: dmg (unsigned, ad-hoc app)
    needs: verify-tag
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      - name: Build the .dmg
        working-directory: apps/gm-desktop
        run: pnpm tauri build --bundles dmg --ci

      - name: Verify the .dmg
        run: |
          bash apps/gm-desktop/scripts/verify-bundle.sh \
            --target dmg \
            --dir apps/gm-desktop/src-tauri/target/release/bundle/dmg

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-dmg
          path: apps/gm-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          # `error`, never `warn`: a glob that matches nothing must fail the
          # job. A release that silently produced nothing is the failure
          # mode this whole file exists to prevent.
          if-no-files-found: error
          retention-days: 30

      # `verify-bundle.sh` records what it actually found — size, sha256,
      # signing state, runner — in `manifest.json` beside the bundle, and both
      # sibling workflows upload it as its own artifact. This file listed
      # `staged/**/manifest.json` in the release `files:` while uploading no
      # manifest at all, so `fail_on_unmatched_files: true` would have thrown
      # "Pattern does not match any files" — after four platform builds had
      # already completed.
      #
      # The rename is load-bearing, not tidiness. `merge-multiple: true` in
      # the draft-release job flattens every `gm-desktop-*` artifact into one
      # `staged/` directory, and four files all named `manifest.json` would
      # land on the same path. Measured with glob 7.2.3 against a flattened
      # staging tree: `staged/**/manifest.json` does match a flat
      # `staged/manifest.json`, so the glob was never the problem — four
      # identically named files would have been. The platform prefix is what
      # keeps them apart.
      - name: Rename the .dmg manifest so four platforms can share one staging dir
        run: |
          mv apps/gm-desktop/src-tauri/target/release/bundle/dmg/manifest.json \
             apps/gm-desktop/src-tauri/target/release/bundle/dmg/dmg-manifest.json

      - name: Upload the .dmg manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-dmg-manifest
          path: apps/gm-desktop/src-tauri/target/release/bundle/dmg/dmg-manifest.json
          if-no-files-found: error
          retention-days: 30

  deb:
    name: deb (unsigned)
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Build the .deb
        working-directory: apps/gm-desktop
        run: pnpm tauri build --bundles deb --ci

      - name: Verify the .deb
        run: |
          bash apps/gm-desktop/scripts/verify-bundle.sh \
            --target deb \
            --dir apps/gm-desktop/src-tauri/target/release/bundle/deb

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-deb
          path: apps/gm-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      # See the note on the .dmg manifest step above: the rename is what keeps
      # four same-named manifests from colliding once `merge-multiple` has
      # flattened them into one directory.
      - name: Rename the .deb manifest so four platforms can share one staging dir
        run: |
          mv apps/gm-desktop/src-tauri/target/release/bundle/deb/manifest.json \
             apps/gm-desktop/src-tauri/target/release/bundle/deb/deb-manifest.json

      - name: Upload the .deb manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-deb-manifest
          path: apps/gm-desktop/src-tauri/target/release/bundle/deb/deb-manifest.json
          if-no-files-found: error
          retention-days: 30

  appimage:
    name: appimage (unsigned)
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Build the .AppImage
        working-directory: apps/gm-desktop
        run: pnpm tauri build --bundles appimage --ci

      - name: Verify the .AppImage
        run: |
          bash apps/gm-desktop/scripts/verify-bundle.sh \
            --target appimage \
            --dir apps/gm-desktop/src-tauri/target/release/bundle/appimage

      - name: Upload the .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-appimage
          path: apps/gm-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      # See the note on the .dmg manifest step above: the rename is what keeps
      # four same-named manifests from colliding once `merge-multiple` has
      # flattened them into one directory.
      - name: Rename the .AppImage manifest so four platforms can share one staging dir
        run: |
          mv apps/gm-desktop/src-tauri/target/release/bundle/appimage/manifest.json \
             apps/gm-desktop/src-tauri/target/release/bundle/appimage/appimage-manifest.json

      - name: Upload the .AppImage manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-appimage-manifest
          path: apps/gm-desktop/src-tauri/target/release/bundle/appimage/appimage-manifest.json
          if-no-files-found: error
          retention-days: 30

  msi:
    name: msi (per-user + per-machine)
    needs: verify-tag
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      # `build-msi.ps1 -Scope both` is what keeps the per-user and
      # per-machine installers from overwriting each other: the bundler
      # names both `product_version_arch_lang.msi`, so the second write
      # would silently replace the first with exit code 0. The script moves
      # each artifact out under a scope-qualified name.
      - name: Build both MSI variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./apps/gm-desktop/scripts/build-msi.ps1 -Scope both -OutputDir msi-out
          if ($LASTEXITCODE -ne 0) { throw "build-msi.ps1 exited $LASTEXITCODE" }

      # Signing runs BEFORE verification, deliberately.
      #
      # `verify-msi.ps1` below extracts each package with `msiexec /a` and
      # cross-checks `manifest.json` against the files on disk. Signing CHANGES
      # those bytes, and `sign-msi.ps1` refreshes the manifest to match. Signing
      # first means the verification covers exactly what ships, and it runs once
      # rather than twice — `msiexec /a` is not cheap.
      #
      # `-Required` is the point of this step. Without it a missing secret is a
      # printed NOTE and exit 0, which is correct for a pull-request build and
      # wrong here: a release that ships unsigned installers while believing it
      # signed them is exactly what the "Unsigned" warning in the release body
      # exists to prevent, and it would end up being the warning that lies.
      - name: Sign the MSIs
        shell: pwsh
        # Secrets arrive as environment variables, never as arguments, so the
        # passphrase never reaches a command line or the log.
        env:
          GITGIT_MSI_PFX_BASE64: ${{ secrets.MSI_SIGN_PFX_BASE64 }}
          GITGIT_MSI_PFX_PASSWORD: ${{ secrets.MSI_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./apps/gm-desktop/scripts/sign-msi.ps1 -Dir msi-out -Required
          if ($LASTEXITCODE -ne 0) { throw "sign-msi.ps1 exited $LASTEXITCODE" }

      # `msiexec /a` reads the file table without installing and without
      # elevation, so this asserts real payload on a stock runner.
      - name: Smoke check the MSIs (no install, no elevation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./apps/gm-desktop/scripts/verify-msi.ps1 -Dir msi-out
          if ($LASTEXITCODE -ne 0) { throw "verify-msi.ps1 exited $LASTEXITCODE" }

      - name: Upload the MSIs
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-msi
          path: msi-out/*.msi
          if-no-files-found: error
          retention-days: 30

      # `build-msi.ps1` writes `msi-out/manifest.json` recording both install
      # scopes; `gm-desktop.yml`'s msi job uploads it as its own artifact.
      # Same collision reason as the three Unix targets, and `Move-Item` here
      # because this job's shell is pwsh.
      - name: Rename the MSI manifest so four platforms can share one staging dir
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Move-Item -LiteralPath 'msi-out/manifest.json' -Destination 'msi-out/msi-manifest.json'

      - name: Upload the MSI manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-msi-manifest
          path: msi-out/msi-manifest.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Collect every platform's artifact into one draft release
  # ---------------------------------------------------------------------------
  draft-release:
    name: attach to a draft release
    needs: [verify-tag, dmg, deb, appimage, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # `pattern: gm-desktop-*` rather than naming each artifact: the
      # bundle workflow decides its own artifact names, and a hard-coded
      # list here would silently stop matching the day a target is added.
      # `merge-multiple: true` is what flattens the per-job directories
      # into one staging dir.
      - name: Download every bundle artifact
        uses: actions/download-artifact@v4
        with:
          pattern: gm-desktop-*
          path: staged
          merge-multiple: true

      - name: Show what will be attached
        run: |
          set -euo pipefail
          find staged -type f | sort | sed 's/^/  /' | tee -a "$GITHUB_STEP_SUMMARY"
          n=$(find staged -type f -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::no installer reached the staging directory; the release would be empty"
            exit 1
          fi
          echo "found $n installer(s)"

      # The release body used to say "Unsigned" unconditionally. That was true
      # when it was written and would have become a lie the moment signing was
      # switched on — and a draft release that misdescribes its own artifacts is
      # worse than one with no description. It is derived from the staged
      # manifest instead, so the claim tracks what actually shipped.
      #
      # Fail-closed on the unsigned branch: the msi job signs with `-Required`,
      # so reaching here unsigned means something upstream did not do what it
      # said. Publishing a release that claims less than it should is a
      # decision a human makes, not one this step makes for them.
      - name: Derive the signing notice from the manifest that was built
        id: signing
        run: |
          set -euo pipefail
          # `-print -quit` rather than `| head -1`: a pipe into `head` closes
          # early and hands `find` a SIGPIPE status, which under `pipefail`
          # turns a successful lookup into a red step.
          m=$(find staged -type f -name 'msi-manifest.json' -print -quit)
          if [ -z "$m" ]; then
            echo "::error::no msi manifest reached the staging directory, so the signing status cannot be stated"
            exit 1
          fi
          signed=$(jq -r '.signing.signed // false' "$m")
          if [ "$signed" != "true" ]; then
            echo "::error::$m records no signature, but the release path requires signed installers. Refusing to attach an unsigned release; publish manually if that is genuinely intended."
            exit 1
          fi
          subject=$(jq -r '.signing.subject' "$m")
          echo "notice=**Signed.** The MSI variants carry an Authenticode signature ($subject), RFC 3161-timestamped. The .dmg is still unnotarised and will trigger Gatekeeper." >> "$GITHUB_OUTPUT"
          echo "signing: $subject" >> "$GITHUB_STEP_SUMMARY"

      # `draft: true` is the entire safety property of this workflow. The
      # release exists and is inspectable, and nobody outside the
      # repository can reach it until a human publishes it.
      - name: Create the draft release
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-tag.outputs.version && format('v{0}', needs.verify-tag.outputs.version) || github.ref_name }}
          name: 'gitgit Desktop ${{ needs.verify-tag.outputs.version }} (unsigned draft)'
          draft: true
          prerelease: false
          body: |
            Automated draft for `${{ github.ref_name }}`.

            ${{ steps.signing.outputs.notice }}

            This release was created by `release.yml` and left as a draft on
            purpose. Publishing it is a human decision.
          files: |
            staged/**/*.msi
            staged/**/*.dmg
            staged/**/*.deb
            staged/**/*.AppImage
            staged/**/*-manifest.json
          # Per-pattern, not per-run. `unmatchedPatterns()` in
          # softprops/action-gh-release throws for EACH glob that matched
          # nothing, so a single entry that cannot match fails the job —
          # which is why the four manifest uploads above exist rather than
          # being optional extras.
          #
          # `**` matches zero directories as well as many, so these resolve
          # against the flattened tree `merge-multiple: true` produces.
          # Measured with glob 7.2.3 against a flattened staging tree rather
          # than assumed.
          fail_on_unmatched_files: true

      # The release is only trustworthy if every file its manifests describe is
      # actually on it. This is not a formality: GitHub rewrites asset names, and
      # softprops/action-gh-release papers over that by writing the original name
      # into the asset's `label` in a BEST-EFFORT path — `maybeRestoreAssetLabel`
      # in src/github.ts catches every failure, logs `console.warn`, and returns
      # the asset unchanged. So the correspondence between a manifest's `file` and
      # a downloadable asset is normally there and silently absent when that call
      # fails, and nothing downstream would notice.
      #
      # Measured on release 404746754 (tag v0.1.0): all 7 installers carry a label
      # equal to the `file` recorded in their manifest, while `name` is GitHub's
      # rewritten form (`gitgit Desktop_…` -> `gitgit.Desktop_…`). This step is
      # what turns "it happened to work" into "it is checked".
      - name: Every file the manifests describe is really on the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::the upload step published no release id, so its asset list cannot be verified"
            exit 1
          fi

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | "\(.name)\t\(.label // "")"' > /tmp/assets.tsv

          installers=$(awk -F'\t' '$1 ~ /\.(msi|dmg|deb|AppImage)$/ { n++ } END { print n + 0 }' /tmp/assets.tsv)
          if [ "$installers" -eq 0 ]; then
            echo "::error::the draft release carries no installer at all; nothing below can be true"
            exit 1
          fi

          # BOTH shapes, deliberately. The per-target manifests carry `artifacts`;
          # the MSI manifest carries `variants`. Reading only one of them would
          # silently check half the release and still report success — "not
          # checked" and "checked and correct" are indistinguishable from here.
          checked=0
          missing=0
          for m in $(find staged -type f -name '*-manifest.json' | sort); do
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              checked=$((checked + 1))
              if ! awk -F'\t' -v want="$file" '$1 == want || $2 == want { found = 1 } END { exit !found }' /tmp/assets.tsv; then
                echo "::error::$m describes '$file', but no uploaded asset carries that name or label"
                missing=$((missing + 1))
              fi
            done < <(jq -r '((.artifacts // []) + (.variants // []))[]?.file // empty' "$m")
          done

          if [ "$checked" -eq 0 ]; then
            echo "::error::no manifest entry was found to check. The manifests use a shape this step does not read, so a green run here would mean nothing."
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing of $checked manifest entries do not correspond to any uploaded asset"
            exit 1
          fi
          # The reverse direction. Every installer on the release must be described
          # by some manifest, or an unverified artifact shipped.
          if [ "$checked" -ne "$installers" ]; then
            echo "::error::manifests describe $checked files but the release carries $installers installers; the two sets must be the same"
            exit 1
          fi

          echo "    ok  all $checked manifest entries resolve to an uploaded asset"
          echo "manifest/asset correspondence verified for $checked file(s)" >> "$GITHUB_STEP_SUMMARY"
