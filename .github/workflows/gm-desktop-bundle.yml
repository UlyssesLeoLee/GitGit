# gm-desktop-bundle CI — the macOS and Linux bundles.
#
# WHAT THIS FILE IS FOR
# =====================
# `apps/gm-desktop/src-tauri/tauri.conf.json` declares
#
#     "targets": ["msi", "dmg", "appimage", "deb"]
#
# but until now only `msi` had ever been built. `.github/workflows/gm-desktop.yml`
# has a `build` job (the fast Linux lint/test gate, which never bundles) and an
# `msi` job (windows-latest, the installer gate). No `.dmg`, `.appimage` or
# `.deb` had ever been produced, on any machine, by any run. For a product
# sold as a desktop application that was the largest untested surface in the
# repo, and `tauri.conf.json` was asserting three platforms that CI had never
# exercised.
#
# It is a SEPARATE FILE, not a third job in `gm-desktop.yml`, for two reasons:
#   * that file is owned and being changed by another lane, and a conflict
#     there loses both changes;
#   * the msi lane's own report argues that a slow installer gate should not
#     live in the same workflow-level `concurrency` group as the fast gate,
#     because `cancel-in-progress: true` on a ~15-minute job cancels a run for
#     every subsequent push (docs/reports/2026-10-05-bundle-ci/README.md §6).
#     These jobs are slower still, so they get their own group.
#
# WHAT IS DELIBERATELY NOT HERE
# =============================
# No signing, no notarization, no release, no updater artifacts, no
# `tauri-action`. This is a build-and-prove gate, not a publishing pipeline.
#
# EVERY CLAIM IS TAGGED
# =====================
# `[FACT]`        established by reading the repo or a document cited inline.
# `[INFERENCE]`   a conclusion drawn from a fact, which a run could refute.
# `[PROPOSAL]`    a suggestion for the owner of a file this lane does not own.
# `[UNVERIFIED-FACT]` documented behaviour relied on here that no run has yet
#                 confirmed. [TBD] is used where the answer is not known.
#
# THE HONEST SUMMARY OF THIS FILE
# ===============================
# [UNVERIFIED-FACT] Nothing in this workflow has ever run. The maintainer
# machine is Windows-only and Tauri cannot cross-compile desktop bundles, so a
# `.dmg` and an `.AppImage` cannot be produced locally at all. What can be
# verified without a runner was verified: the YAML parses, the verify script
# passes `bash -n`, and its argument parsing, size floor, version assertion
# and format-magic rejection were exercised against deliberately broken
# fixtures. What a first run settles is listed in `.github/CI.md` and in the
# commit message. A red first run is a finding, not a defect in the reasoning.
name: gm-desktop-bundle

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/gm-desktop/**'
      - '.github/workflows/gm-desktop-bundle.yml'
      # The sibling desktop workflow is listed because a change to it can
      # change the toolchain or the prerequisite set these jobs assume. A
      # workflow that builds the same crate must react to a change in how that
      # crate is built.
      - '.github/workflows/gm-desktop.yml'
      # The desktop crate consumes the root crate BY PATH
      # (`gitgit = { path = "../../.." }` in src-tauri/Cargo.toml), so a change
      # to the root manifest or lockfile can break the cargo build these jobs
      # run. gm-desktop.yml already lists both for exactly this reason, and
      # the reason that omission cost this repo a full day of undetected
      # breakage: the offending commit touched only root `Cargo.toml` and
      # `Cargo.lock`, so the workflow never ran and nothing noticed.
      - 'Cargo.toml'
      - 'Cargo.lock'
      # `src/**` is a deliberate difference from gm-desktop.yml, which does not
      # list it. The reason is the same path dependency: the desktop binary
      # links the root crate's library, so a change to `src/**` can break
      # `tauri build` on macOS and Linux exactly as it can on Windows. A
      # bundle rebuilt only when `apps/gm-desktop/**` changes proves nothing
      # about the current `dev`. [PROPOSAL] gm-desktop.yml has the same gap and
      # could adopt this; that file is not owned by this lane.
      - 'src/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/gm-desktop/**'
      - '.github/workflows/gm-desktop-bundle.yml'
      - '.github/workflows/gm-desktop.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  # A first run on a pull request from this branch is the intended way to
  # exercise it, but a manual trigger costs nothing and does not need a branch.
  workflow_dispatch:

# Own group, and NOT cancel-in-progress. A push to the same ref must not kill
# a macOS release build that is eight minutes in; the fast gate in
# gm-desktop.yml keeps that behaviour because a 25-second lint step is cheap to
# redo and a 15-minute installer is not.
concurrency:
  group: gm-desktop-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  dmg:
    name: dmg (unsigned, ad-hoc app)
    runs-on: macos-latest
    # Longer than the msi job's 45: the hosted macOS image is the slowest of
    # the three, and this job additionally mounts the produced image to verify
    # it. [UNVERIFIED-FACT] That ranking is an expectation, not a measurement.
    timeout-minutes: 60
    env:
      # No Apple certificate exists for this project and none is configured, so
      # there is nothing to sign with. Tauri's docs state the identity can be
      # given as `APPLE_SIGNING_IDENTITY` or `bundle.macOS.signingIdentity`, and
      # that the pseudo-identity `-` produces an AD-HOC signature
      # (https://v2.tauri.app/distribute/sign/macos/, "Ad-Hoc Signing"). The
      # same page says this matters on Apple Silicon, where apps from the
      # Internet must be code-signed at all.
      #
      # [FACT] With no identity set at all, tauri-bundler does not sign:
      # `macos/sign.rs::keychain()` returns `Ok(None)` when neither
      # `APPLE_CERTIFICATE` nor an identity is present
      # (crates/tauri-bundler/src/bundle/macos/sign.rs). So this is not
      # cosmetic — it is what makes the artifact a runnable one rather than an
      # unsigned arm64 binary.
      #
      # [FACT] `-` also stops the bundler trying to sign the DMG itself:
      # `macos/dmg/mod.rs` guards the DMG signing step with
      # `identity != Some("-")`.
      #
      # NOTARIZATION IS NOT DONE AND IS NOT POSSIBLE HERE.
      # [FACT] `macos/sign.rs::notarize_auth()` can only produce credentials
      # from `APPLE_ID` + `APPLE_PASSWORD` + `APPLE_TEAM_ID` or from an App
      # Store Connect API key, and this project has none. [FACT] Tauri's docs
      # also state that notarization is required when using a Developer ID
      # Application certificate, and that ad-hoc signing does not stop macOS
      # from requiring the user to whitelist the app in Privacy & Security.
      # The consequence, stated plainly: this .dmg is a build artefact for CI,
      # not something a user can install without friction.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4

      # Same ordering constraint as every other job in this repo: pnpm BEFORE
      # setup-node, because setup-node shells out to `pnpm store path` to
      # resolve the cache directory when `cache: 'pnpm'` is set. Install pnpm
      # afterwards and setup-node fails with "Unable to locate executable
      # file: pnpm", skipping every later step.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      # `--frozen-lockfile` is not negotiable. `package.json` and
      # `pnpm-lock.yaml` are untouched by this lane, so the lock must satisfy
      # the manifest exactly; if it does not, this fails here instead of
      # silently resolving something new and skipping every later gate.
      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      # `rust-toolchain.toml` at the repo root pins 1.98.1 and rustup honours
      # it from this directory downwards, so `@stable` installs a toolchain
      # that is then overridden by the pin. Same shape as the other jobs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No `pnpm build` step: `tauri.conf.json > build.beforeBuildCommand` is
      # `pnpm build`, so `tauri build` runs the Vite production build itself.
      # The msi job relies on the same mechanism.
      #
      # `--ci` matches build-msi.ps1's invocation. Note there is no `--locked`
      # and that is not an oversight: `src-tauri/Cargo.lock` is stale against
      # the root crate it takes by path, so a `--locked` build fails outright
      # (docs/reports/2026-10-05-bundle-ci/README.md §7). `tauri build` runs
      # cargo without `--locked`, so the runner re-resolves and rewrites the
      # lock. That works, it needs network on the runner, and it means the
      # artifact is not built from the committed lock.
      - name: Build the .dmg
        working-directory: apps/gm-desktop
        run: pnpm tauri build --bundles dmg --ci

      # Opens the image read-only and checks the .app inside it, which is the
      # macOS counterpart of the MSI job's `msiexec /a` administrative install:
      # read the package, install nothing, need no privileges. Fails closed —
      # if the image cannot be mounted, the job is red, because an artifact we
      # could not open is not evidence that the bundler worked.
      - name: Verify the .dmg
        run: |
          bash apps/gm-desktop/scripts/verify-bundle.sh \
            --target dmg \
            --dir apps/gm-desktop/src-tauri/target/release/bundle/dmg

      # The artifact name comes from the manifest the verify step wrote, so it
      # cannot drift from what was actually built. A missing or versionless
      # manifest fails here rather than producing an artifact named
      # `gm-desktop-dmg-`.
      - name: Read bundle metadata
        id: meta
        run: |
          set -euo pipefail
          manifest="apps/gm-desktop/src-tauri/target/release/bundle/dmg/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::no bundle manifest at $manifest"
            exit 1
          fi
          version=$(jq -r '.version // empty' "$manifest")
          if [ -z "$version" ]; then
            echo "::error::$manifest records no version"
            cat "$manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "signing=$(jq -r '.signing // "unknown"' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "dmg built, unsigned=${version}" >> "$GITHUB_STEP_SUMMARY"

      # `if-no-files-found: error` on every upload, for the reason the msi job
      # already states: with the default `warn`, a glob that matches nothing
      # leaves a GREEN job with no installer at all. A packaging gate that
      # cannot fail when it produces nothing is not a gate.
      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-dmg-${{ steps.meta.outputs.version }}
          path: apps/gm-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundle manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-dmg-${{ steps.meta.outputs.version }}-manifest
          path: apps/gm-desktop/src-tauri/target/release/bundle/dmg/manifest.json
          if-no-files-found: error
          retention-days: 14

      # Uploaded on failure so a red run is diagnosable without re-running it.
      # `ignore` is correct here and only here: the job is already red, and
      # this step exists precisely for the case where the bundle is missing.
      - name: Upload bundle directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-dmg-build-log
          path: apps/gm-desktop/src-tauri/target/release/bundle/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Linux — .deb
  # ---------------------------------------------------------------------------
  deb:
    name: deb (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Published so `deb-install` below can name the artifact without
    # re-reading the manifest. A glob would match the `-manifest` artifact too.
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The same package set the `build` job in gm-desktop.yml already
      # installs, verbatim, plus `file`.
      #
      # Reusing that list is the point: it has been reviewed in this repo and
      # a full `tauri build` on Linux is the first thing to exercise it, so
      # inventing a second list would be guessing. `libwebkit2gtk-4.1-dev`,
      # `libappindicator3-dev` and `librsvg2-dev` are Tauri's documented Linux
      # prerequisites (https://v2.tauri.app/start/prerequisites/, Debian tab),
      # and `patchelf` is required by the bundler.
      #
      # `file` is the one addition and it is not a Tauri prerequisite: the
      # AppImage check calls `file(1)`. It is in the same documented Debian list
      # above, so adding it here is still following the document rather than
      # guessing. `dpkg-deb`, needed by the .deb check, comes from `dpkg`, which
      # is part of the base image; if it were ever absent the verify script
      # fails with a message saying so rather than skipping the check.
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Build the .deb
        working-directory: apps/gm-desktop
        run: pnpm tauri build --bundles deb --ci

      # `dpkg-deb --info` parses the control fields and `Version:` is asserted
      # against `tauri.conf.json`; `--contents` must list the real binary above
      # a size floor plus a freedesktop `.desktop` entry. The Linux bundler
      # makes no network calls, so this job has no download step and no
      # upstream rate limit to hit.
      #
      # `[FACT]` The dependency names below were not looked up and copied;
      # this step is what turns them into a checked fact. A `Depends:`
      # line naming a package that does not exist is worse than no
      # `Depends:` line at all: `dpkg -i` refuses to install a package
      # whose dependencies cannot be satisfied, so a wrong name turns
      # "installs, then fails to launch on a bare machine" into "refuses
      # to install anywhere". The runner has the runtime packages present
      # (the `-dev` packages installed for the build pull them in), so
      # `dpkg-query` is a real existence check, not a guess.
      - name: Assert the declared dependencies are real packages
        run: |
          set -euo pipefail
          mapfile -t deps < <(jq -r '.bundle.linux.deb.depends // [] | .[]' \
            apps/gm-desktop/src-tauri/tauri.conf.json)
          if [ "${#deps[@]}" -eq 0 ]; then
            echo "::error::bundle.linux.deb.depends is empty; the .deb would install with no runtime dependencies and fail to launch without webkit2gtk"
            exit 1
          fi
          for dep in "${deps[@]}"; do
            # `dpkg-query -W` exits non-zero for an unknown package, which
            # under `set -e` is the failure we want, but the message is
            # useless, so it is turned into a diagnostic.
            if ! dpkg-query -W -f='${Status} ${Version}\n' "$dep" 2>/dev/null; then
              echo "::error::'$dep' is declared in bundle.linux.deb.depends but is not a known package on $(. /etc/os-release && echo "$PRETTY_NAME"). A Depends: line naming a nonexistent package makes the .deb uninstallable."
              echo "--- available candidates ---"
              apt-cache search --names-only 'webkit2gtk' | head -10 || true
              apt-cache search --names-only '^libgtk-3' | head -10 || true
              exit 1
            fi
            echo "ok  $dep -> $(dpkg-query -W -f='${Version}' "$dep")"
          done

      - name: Verify the .deb
        run: |
          bash apps/gm-desktop/scripts/verify-bundle.sh \
            --target deb \
            --dir apps/gm-desktop/src-tauri/target/release/bundle/deb

      - name: Read bundle metadata
        id: meta
        run: |
          set -euo pipefail
          manifest="apps/gm-desktop/src-tauri/target/release/bundle/deb/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::no bundle manifest at $manifest"
            exit 1
          fi
          version=$(jq -r '.version // empty' "$manifest")
          if [ -z "$version" ]; then
            echo "::error::$manifest records no version"
            cat "$manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb built, version=${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-deb-${{ steps.meta.outputs.version }}
          path: apps/gm-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundle manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-deb-${{ steps.meta.outputs.version }}-manifest
          path: apps/gm-desktop/src-tauri/target/release/bundle/deb/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundle directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-deb-build-log
          path: apps/gm-desktop/src-tauri/target/release/bundle/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Linux — the .deb installed FOR REAL
  # ---------------------------------------------------------------------------
  # WHY A CONTAINER, AND WHY IT IS NOT PART OF THE `deb` JOB
  # ======================================================
  # [FACT] Everything `deb` already checks is structural. `verify-bundle.sh`
  # parses the control fields, compares the version to `tauri.conf.json`,
  # requires a plausible `usr/bin/<bin>` and a freedesktop `.desktop` entry.
  # It never installs anything, so it cannot find out whether the package
  # installs on a machine that does not already have the GTK/WebKit stack.
  #
  # [INFERENCE] Running the install on the hosted `ubuntu-latest` runner would
  # prove almost nothing, and the reason is worth stating because it is not
  # obvious: the `deb` job installs libwebkit2gtk-4.1-dev and friends ON THAT
  # MACHINE, so a package with a missing dependency would still install
  # happily. `ubuntu:24.04` has none of it. The container is what makes this a
  # test rather than a restatement of what the build already proved.
  #
  # It is a separate job with `needs: deb` rather than steps inside `deb`,
  # because the build machine is the wrong machine — see above — and because a
  # job-level `container:` applies to every step, retro-fitting it would have
  # meant moving the whole release build into a minimal image that lacks the
  # toolchain. The `needs:` does weaken the independence argued for in the
  # AppImage comment below, and deliberately: if the .deb was not built there
  # is nothing to install, and `skipped` says that honestly where a red would
  # not.
  deb-install:
    name: deb installs and links on a stock Ubuntu
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ubuntu:24.04
    # [FACT] A job with `container:` runs every `run:` step under `/bin/sh`,
    # not the bash that a job on a hosted Ubuntu image gets. On ubuntu:24.04
    # `sh` is dash.
    #
    # [FACT] That is not a stylistic difference. These steps die on their
    # first line, before any assertion runs:
    #   /__w/_temp/<uuid>.sh: 1: set: Illegal option -o pipefail
    #   ##[error]Process completed with exit code 2.
    # and the last step additionally uses `<(...)` process substitution, which
    # dash has no syntax for at all. Observed on run 37551742758; the job
    # reported `apt-get install` as the failing step while in fact the package
    # was never touched.
    #
    # So `shell: bash` is set once here, at job level, rather than per step:
    # a step added to this job later inherits it instead of silently reverting
    # to dash. `tests/unit/deb-install-gate.test.ts` enforces this.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gm-desktop-deb-${{ needs.deb.outputs.version }}
          path: pkg

      - name: Install it the way a user would, letting apt resolve Depends
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # `apt-get install ./pkg/*.deb`, NOT `dpkg -i`. `dpkg -i` refuses to
          # configure a package whose dependencies are unmet and leaves it
          # unpacked and half-registered; resolving them is what someone
          # installing from a repo or an .deb URL actually gets, so that is
          # what is under test. `apt-get -f install` afterwards would repair a
          # broken `dpkg -i` and hide exactly the defect being looked for.
          apt-get install -y --no-install-recommends ./pkg/*.deb

      - name: It is registered, and the binary it names is really there
        run: |
          set -euo pipefail
          pkg=$(dpkg-deb --info pkg/*.deb \
            | awk '/^[[:space:]]*Package:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')
          if [ -z "$pkg" ]; then
            echo "::error::the .deb declares no Package: field"
            exit 1
          fi
          status=$(dpkg-query -W -f='${Status}' "$pkg")
          if [ "$status" != "install ok installed" ]; then
            echo "::error::$pkg reports '$status' after install, not 'install ok installed'"
            exit 1
          fi
          bin=$(dpkg -L "$pkg" | awk '/^\/usr\/bin\// { print; exit }')
          if [ -z "$bin" ]; then
            echo "::error::$pkg installs no /usr/bin entry, so nothing can launch it"
            exit 1
          fi
          if [ ! -x "$bin" ]; then
            echo "::error::$bin is not executable after install"
            exit 1
          fi
          echo "    ok  $pkg -> $bin ($(wc -c < "$bin") B)"
          printf '%s' "$bin" > /tmp/gitgit-bin
          printf '%s' "$pkg"  > /tmp/gitgit-pkg

      - name: Every shared library the binary needs was actually pulled in
        run: |
          set -euo pipefail
          bin=$(cat /tmp/gitgit-bin)
          # The decisive assertion, and the one that makes this job worth its
          # runner minutes.
          #
          # If `bundle.linux.deb.depends` were empty or incomplete, `ldd` prints
          # `=> not found` for every library that was never installed. The app
          # would then fail to start on a clean machine while EVERY structural
          # check in `verify-bundle.sh` still passed — which is precisely the
          # failure the deb job is unable to see.
          missing=$(ldd "$bin" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::$bin has unresolved shared libraries after a clean install."
            echo "Either bundle.linux.deb.depends is missing an entry, or the image"
            echo "could not satisfy it. Unresolved:"
            echo "$missing"
            exit 1
          fi
          echo "    ok  $(ldd "$bin" | grep -c '=>') libraries resolved"

      - name: The freedesktop entry a package manager would show is valid
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends desktop-file-utils
          pkg=$(cat /tmp/gitgit-pkg)
          # `dpkg -L` then a loop rather than `| head -1`: a pipe into `head`
          # closes early and hands the producer a SIGPIPE status, which under
          # `pipefail` turns a successful lookup into a red step.
          entry=""
          while IFS= read -r f; do
            case "$f" in *.desktop) entry="$f"; break ;; esac
          done < <(dpkg -L "$pkg")
          if [ -z "$entry" ]; then
            echo "::error::$pkg installs no .desktop entry, so no menu or file association is created"
            exit 1
          fi
          desktop-file-validate "$entry"
          echo "    ok  $entry"

      # NOT CHECKED HERE, DELIBERATELY: that the window actually opens.
      # A webkit/GTK application under `xvfb-run` on a container with no dbus,
      # no seat and no hardware fails for reasons that have nothing to do with
      # packaging, and a gate that goes red for those reasons gets switched
      # off. What is proven above is the part packaging controls: the package
      # installs on a machine with nothing preinstalled, its dependency list is
      # sufficient to link the binary, and its launch metadata is well-formed.
      # "[UNVERIFIED-FACT] The GUI has still never been observed running."

  # ---------------------------------------------------------------------------
  # Linux — AppImage
  # ---------------------------------------------------------------------------
  #
  # WHY THIS IS A SEPARATE JOB AND NOT A SECOND TARGET IN `deb`
  # =========================================================
  # [FACT] The AppImage bundler downloads, at build time and on every cold
  # runner, from crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy.rs:
  #   * `AppRun-{arch}` from github.com/tauri-apps/binary-releases — a hard
  #     failure if the download fails, the error is propagated with `?`;
  #   * `linuxdeploy-{arch}.AppImage`, pinned to linuxdeploy commit 07333c6 —
  #     also a hard failure;
  #   * `linuxdeploy-plugin-appimage-{arch}.AppImage` from the linuxdeploy
  #     `continuous` release — this one is NOT fatal: the code catches the
  #     error, logs it, and falls back to a built-in version.
  # So two mandatory GitHub downloads and one optional one, on a build that has
  # to be fast, with no retry and no cache in this workflow.
  #
  # [FACT] One real flake risk is already designed out: the bundler runs
  # linuxdeploy with `APPIMAGE_EXTRACT_AND_RUN=1` and passes
  # `--appimage-extract-and-run`, so the AppImage tooling does not need FUSE.
  #
  # [INFERENCE] Rate-limiting or a transient 5xx on either mandatory download
  # turns this job red with a build error that says nothing about the repo.
  # Keeping it in its own job means that failure is attributable to `appimage`
  # alone: `dmg` and `deb` still report independently and neither can hide the
  # other's result. That is the same reasoning the msi lane used to justify
  # not chaining `msi` behind `build` with `needs`
  # (docs/reports/2026-10-05-bundle-ci/README.md §6), and it is why no job
  # here has a `needs:`. The cost is a second cold release build of the same
  # crate tree on ubuntu-latest.
  #
  # [PROPOSAL] The cheaper shape is one Linux job building
  # `--bundles deb,appimage` (one compile, two checks, and the .deb uploaded
  # before the AppImage check runs). It trades the attribution above for
  # roughly one release build's worth of runner minutes. Not taken here
  # because a network flake in the AppImage download would then also redden the
  # .deb gate, which is the outcome this file exists to avoid. If the runtime
  # cost turns out to matter, that is the change to make — and it is a
  # two-line edit.
  appimage:
    name: appimage (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/gm-desktop
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Identical to the `deb` job above, and identical to the `build` job in
      # gm-desktop.yml, for the same reasons. Repeated rather than extracted
      # into a composite action on purpose: a composite would be a new
      # indirection in a file whose whole value is being readable, and the
      # drift risk is nil while the two lists sit eleven lines apart.
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Build the .AppImage
        working-directory: apps/gm-desktop
        run: pnpm tauri build --bundles appimage --ci

      # ELF magic + `file` reporting a 64-bit ELF executable + a size floor.
      # The magic is what fails an "AppImage" that is really the Vite web
      # bundle, and the tightened `file` match is what fails a file whose only
      # correct property is four magic bytes.
      - name: Verify the .AppImage
        run: |
          bash apps/gm-desktop/scripts/verify-bundle.sh \
            --target appimage \
            --dir apps/gm-desktop/src-tauri/target/release/bundle/appimage

      - name: Read bundle metadata
        id: meta
        run: |
          set -euo pipefail
          manifest="apps/gm-desktop/src-tauri/target/release/bundle/appimage/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::no bundle manifest at $manifest"
            exit 1
          fi
          version=$(jq -r '.version // empty' "$manifest")
          if [ -z "$version" ]; then
            echo "::error::$manifest records no version"
            cat "$manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "appimage built, version=${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-appimage-${{ steps.meta.outputs.version }}
          path: apps/gm-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundle manifest
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-appimage-${{ steps.meta.outputs.version }}-manifest
          path: apps/gm-desktop/src-tauri/target/release/bundle/appimage/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundle directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gm-desktop-appimage-build-log
          path: apps/gm-desktop/src-tauri/target/release/bundle/
          if-no-files-found: ignore
          retention-days: 7
