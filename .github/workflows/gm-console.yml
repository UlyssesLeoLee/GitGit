# gm-console CI — V0.1 baseline.
#
# Triggers: every push to a branch that touches `apps/gm-console/**` or
# `src/server/api.rs`, plus PRs targeting `dev` or `main`. The job runs
# typecheck + lint + unit tests + a production build on Ubuntu. The
# mock server (MSW) is exercised in the test step; no live gitgit-server
# is required.
name: gm-console

on:
  push:
    branches: [dev, main, feature/gm-console-v0.1]
    paths:
      - 'apps/gm-console/**'
      - 'src/server/api.rs'
      - '.github/workflows/gm-console.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/gm-console/**'
      - 'src/server/api.rs'
      - '.github/workflows/gm-console.yml'

concurrency:
  group: gm-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/gm-console/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: apps/gm-console
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/gm-console
        run: pnpm typecheck

      - name: Lint
        working-directory: apps/gm-console
        run: pnpm lint

      - name: Unit tests
        working-directory: apps/gm-console
        run: pnpm test --reporter=verbose

      - name: Coverage gate (lines ≥ 70%)
        working-directory: apps/gm-console
        run: pnpm test:coverage

      - name: Format check
        working-directory: apps/gm-console
        run: pnpm format:check

      - name: Build
        working-directory: apps/gm-console
        run: pnpm build
        env:
          VITE_ENABLE_MOCKS: 'false'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm-console-coverage
          path: apps/gm-console/coverage/
          retention-days: 14

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gm-console-dist
          path: apps/gm-console/dist/
          retention-days: 14