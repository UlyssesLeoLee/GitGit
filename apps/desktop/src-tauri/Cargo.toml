[package]
name = "gitgit-desktop"
version = "0.1.0"
description = "GitGit Desktop — local-first engineering knowledge graph viewer"
authors = ["GitGit"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gitgit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
