[package]
name = "gitgit-server"
description = "主服务 binary：HTTP API + gRPC + 平台进程。详细设计 §08-api-handlers.md + §13-admin-api-and-ops-ui.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
    anyhow = { workspace = true }
    tracing = { workspace = true }
    axum = { workspace = true }
    tower = { workspace = true }
    tower-http = { workspace = true }
    tonic = { workspace = true }
    sqlx = { workspace = true }
    tokio = { workspace = true }
    serde = { workspace = true }
    clap = { workspace = true }
    gitgit-core = { workspace = true }
    gitgit-graph = { workspace = true }
    gitgit-policy = { workspace = true }
    gitgit-ai = { workspace = true }
    gitgit-agent = { workspace = true }
    gitgit-app = { workspace = true }
    gitgit-git = { workspace = true }
    gitgit-errors = { workspace = true }
    gitgit-config = { workspace = true }
    gitgit-observability = { workspace = true }
    gitgit-proto = { workspace = true }
    rmcp = { workspace = true }

[dev-dependencies]
gitgit-errors = { workspace = true }
mockall = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "server"
path = "src/main.rs"


