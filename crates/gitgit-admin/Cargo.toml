[package]
name = "gitgit-admin"
description = "Admin 独立子进程：鉴权域分离 + admin_audit。详细设计 §13-admin-api-and-ops-ui.md + SEC-REQ-011"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
    axum = { workspace = true }
    tower = { workspace = true }
    tower-http = { workspace = true }
    sqlx = { workspace = true }
    tokio = { workspace = true }
    serde = { workspace = true }
    clap = { workspace = true }
    jsonwebtoken = { workspace = true }
    totp-rs = { workspace = true }
    webauthn-rs = { workspace = true }
    gitgit-core = { workspace = true }
    gitgit-graph = { workspace = true }
    gitgit-policy = { workspace = true }
    gitgit-app = { workspace = true }
    gitgit-errors = { workspace = true }
    gitgit-config = { workspace = true }
    gitgit-observability = { workspace = true }
    gitgit-proto = { workspace = true }

[dev-dependencies]
gitgit-errors = { workspace = true }
mockall = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "admin"
path = "src/main.rs"
