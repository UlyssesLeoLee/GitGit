syntax = "proto3";
package gitgit.graph.v1;

// 图谱服务：5 原语操作
service GraphService {
  // 节点
  rpc CreateNode(CreateNodeRequest) returns (Node);
  rpc GetNode(GetNodeRequest) returns (Node);
  rpc UpdateNode(UpdateNodeRequest) returns (Node);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);

  // 边
  rpc CreateEdge(CreateEdgeRequest) returns (Edge);
  rpc Traverse(TraverseRequest) returns (TraverseResponse);

  // 事件查询
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsResponse);
}

message Node {
  string id = 1;
  string type = 2;
  string subtype = 3;
  int32 schema_version = 4;
  bytes data = 5;                    // JSON bytes
  string epistemic_status = 6;
  int64 created_at_unix_ms = 7;
  string tenant_id = 8;
}

message Edge {
  string id = 1;
  string src_id = 2;
  string dst_id = 3;
  string type = 4;
  bytes data = 5;
  int64 created_at_unix_ms = 6;
}

message CreateNodeRequest {
  string type = 1;
  string subtype = 2;
  bytes data = 3;
  string correlation_id = 4;
}

message GetNodeRequest { string id = 1; }
message UpdateNodeRequest { string id = 1; bytes data = 2; int32 expected_version = 3; }
message DeleteNodeRequest { string id = 1; }
message DeleteNodeResponse { bool found = 1; }

message CreateEdgeRequest {
  string src_id = 1;
  string dst_id = 2;
  string type = 3;
  bytes data = 4;
}

message TraverseRequest {
  string start_id = 1;
  string direction = 2;              // 'out' | 'in' | 'both'
  repeated string edge_types = 3;
  int32 max_depth = 4;
}

message TraverseResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message QueryEventsRequest {
  string actor_id = 1;
  string target_id = 2;
  string type = 3;
  int64 from_unix_ms = 4;
  int64 to_unix_ms = 5;
  int32 limit = 6;
  string cursor = 7;
}

message Event {
  int64 id = 1;
  string type = 2;
  string actor_id = 3;
  string target_id = 4;
  bytes data = 5;
  int64 created_at_unix_ms = 6;
}

message QueryEventsResponse {
  repeated Event events = 1;
  string next_cursor = 2;
}
