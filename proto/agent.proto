syntax = "proto3";
package gitgit.agent.v1;

// Agent 运行时
service AgentRuntime {
  rpc StartRun(StartRunRequest) returns (AgentRun);
  rpc GetRun(GetRunRequest) returns (AgentRun);
  rpc ApproveRun(ApproveRunRequest) returns (AgentRun);
  rpc StreamEvents(StreamEventsRequest) returns (stream AgentEvent);
}

message StartRunRequest {
  string agent_id = 1;
  bytes input = 2;
  string parent_run_id = 3;
}

message GetRunRequest { string run_id = 1; }
message ApproveRunRequest { string run_id = 1; string approver_id = 2; bool approved = 3; string comment = 4; }

message AgentRun {
  string id = 1;
  string agent_id = 2;
  string state = 3;                    // 'pending'|'running'|'awaiting_approval'|'completed'|'failed'
  bytes input = 4;
  bytes output = 5;
  bytes error = 6;
  int64 started_at_unix_ms = 7;
  int64 finished_at_unix_ms = 8;
  string correlation_id = 9;
}

message StreamEventsRequest { string run_id = 1; }

message AgentEvent {
  string run_id = 1;
  string type = 2;
  bytes data = 3;
  int64 ts_unix_ms = 4;
}
