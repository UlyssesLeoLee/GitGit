syntax = "proto3";
package gitgit.ai.v1;

// AI 网关服务 (内部 gRPC; 外部 HTTP)
service AIGateway {
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
}

message CompleteRequest {
  string provider = 1;                  // 'openai' | 'anthropic' | 'local' 等
  string model = 2;
  repeated ChatMessage messages = 3;
  double temperature = 4;
  int32 max_tokens = 5;
  map<string, string> metadata = 6;
  string correlation_id = 7;
}

message ChatMessage {
  string role = 1;                      // 'system' | 'user' | 'assistant' | 'tool'
  string content = 2;
  string name = 3;
  string tool_call_id = 4;
}

message CompleteResponse {
  string provider = 1;
  string model = 2;
  ChatMessage message = 3;
  int32 input_tokens = 4;
  int32 output_tokens = 5;
  int64 cost_micro_cents = 6;
  int64 latency_ms = 7;
  string finish_reason = 8;
}

message EmbedRequest {
  string provider = 1;
  string model = 2;
  repeated string inputs = 3;
}
message EmbedResponse {
  repeated bytes vectors = 1;            // f32 little-endian
  int32 dim = 2;
  int32 input_tokens = 3;
}
