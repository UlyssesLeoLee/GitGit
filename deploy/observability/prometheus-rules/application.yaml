# 应用告警规则
# 关联: docs/observability/08-alert-design.md §5.3

groups:
  - name: application-alerts
    interval: 30s
    rules:
      # ===== HTTP RED =====
      - alert: HttpErrorRateHigh
        expr: |
          (
            sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          domain: application
          team: '{{ printf "backend-%s" $labels.service | replace "-" "-" }}'
        annotations:
          summary: "{{ $labels.service }} 5xx 错误率 {{ printf \"%.2f\" (mul $value 100) }}%"
          runbook: |
            1. 查看 30-Application 错误面板
            2. 检查最新部署
            3. 检查依赖
            4. 必要时回滚

      - alert: HttpP99LatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: critical
          domain: application
          team: backend
        annotations:
          summary: "{{ $labels.service }} P99 延迟 {{ printf \"%.2f\" $value }}s"
          impact: "用户感知慢请求"
          runbook: |
            1. 查看 70-Performance 慢 Span
            2. 检查 SQL 性能
            3. 检查下游依赖

      - alert: HttpP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 15m
        labels:
          severity: warning
          domain: application
          team: backend
        annotations:
          summary: "{{ $labels.service }} P95 延迟 {{ printf \"%.2f\" $value }}s"

      - alert: HttpRequestRateDrop
        expr: |
          sum by (service) (rate(http_requests_total[5m]))
            /
          sum by (service) (rate(http_requests_total[5m] offset 1d)) < 0.5
        for: 10m
        labels:
          severity: warning
          domain: application
          team: backend
        annotations:
          summary: "{{ $labels.service }} 流量同比昨日减半"

      # ===== DB 业务 =====
      - alert: DBPoolExhausted
        expr: |
          max by (service, db) (db_pool_size - db_pool_idle) / db_pool_size > 0.95
        for: 2m
        labels:
          severity: critical
          domain: application
          team: backend
        annotations:
          summary: "{{ $labels.service }} DB 连接池耗尽"
          runbook: "1. 评估长事务 2. 临时扩容 pool 3. 排查 leak"

      - alert: SlowQueryRateHigh
        expr: |
          rate(pg_slow_queries_total[5m]) > 1
        for: 10m
        labels:
          severity: warning
          domain: application
          team: backend
        annotations:
          summary: "慢查询 {{ $value }}/s"

      # ===== AI 网关 =====
      - alert: AIGatewayErrorRate
        expr: |
          (
            sum by (vendor) (rate(gitgit_ai_gateway_requests_total{result=~"error|timeout"}[5m]))
            /
            sum by (vendor) (rate(gitgit_ai_gateway_requests_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
          domain: application
          team: backend-ai
        annotations:
          summary: "AI 网关 {{ $labels.vendor }} 错误率 {{ printf \"%.2f\" (mul $value 100) }}%"

      - alert: AIGatewayLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le, vendor) (rate(gitgit_ai_gateway_duration_seconds_bucket[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          domain: application
          team: backend-ai
        annotations:
          summary: "AI 网关 {{ $labels.vendor }} P95 延迟 {{ printf \"%.2f\" $value }}s"

      - alert: AIGatewayCostSpike
        expr: |
          sum(rate(gitgit_ai_cost_usd_sum[5m])) > 1
        for: 1h
        labels:
          severity: warning
          domain: application
          team: backend-ai
        annotations:
          summary: "AI 网关 5min 内成本 > $1"

      # ===== Agent =====
      - alert: AgentRunFailureRate
        expr: |
          (
            sum(rate(gitgit_agent_run_total{result="failed"}[10m]))
            /
            sum(rate(gitgit_agent_run_total[10m]))
          ) > 0.10
        for: 15m
        labels:
          severity: warning
          domain: application
          team: backend-agent
        annotations:
          summary: "Agent Run 失败率 {{ printf \"%.2f\" (mul $value 100) }}%"

      # ===== 中心事件 =====
      - alert: EventJournalBacklog
        expr: max by (topic) (gitgit_event_journal_unpublished_count) > 10000
        for: 5m
        labels:
          severity: high
          domain: middleware
          team: sre-mw
        annotations:
          summary: "中心事件 {{ $labels.topic }} 积压 {{ $value }}"

      - alert: EventConsumerLag
        expr: |
          max by (topic, consumer) (gitgit_event_journal_lag_seconds) > 60
        for: 5m
        labels:
          severity: warning
          domain: middleware
          team: sre-mw
        annotations:
          summary: "事件消费 {{ $labels.consumer }} lag {{ $value }}s"

      # ===== Git 协议 =====
      - alert: GitPushFailure
        expr: |
          sum by (repo_namespace) (rate(gitgit_git_protocol_requests_total{verb="push",status_class="5xx"}[5m])) > 0.5
        for: 5m
        labels:
          severity: high
          domain: middleware
          team: sre-mw
        annotations:
          summary: "{{ $labels.repo_namespace }} Git Push 5xx"

      - alert: GitPushLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, repo_namespace) (rate(gitgit_git_protocol_request_duration_seconds_bucket{verb="push"}[5m]))
          ) > 30
        for: 10m
        labels:
          severity: warning
          domain: middleware
          team: sre-mw
        annotations:
          summary: "{{ $labels.repo_namespace }} Git Push P95 延迟 {{ $value }}s"

      - alert: GitWriteIndexLock
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(gitgit_git_write_index_lock_wait_seconds_bucket[5m]))
          ) > 5
        for: 5m
        labels:
          severity: warning
          domain: middleware
          team: sre-mw
        annotations:
          summary: "Git 写 index lock 等待 {{ $value }}s"

      # ===== App Bus =====
      - alert: AppBusCapabilityDenied
        expr: |
          sum by (app, capability) (rate(gitgit_app_bus_capability_denied_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          domain: security
          team: sec-oncall
        annotations:
          summary: "App {{ $labels.app }} 越权 {{ $labels.capability }}"

      - alert: AppBusFuelExhausted
        expr: |
          sum by (app) (rate(gitgit_app_bus_fuel_exhausted_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          domain: middleware
          team: sre-mw
        annotations:
          summary: "App {{ $labels.app }} fuel 耗尽"

      # ===== Auth =====
      - alert: AuthFailureBurst
        expr: |
          sum by (user) (rate(gitgit_auth_failures_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          domain: security
          team: sec-oncall
        annotations:
          summary: "用户 {{ $labels.user }} 认证失败激增（疑似暴力破解）"
          runbook: |
            1. 检查 IP 分布
            2. 临时封禁
            3. 通知用户
