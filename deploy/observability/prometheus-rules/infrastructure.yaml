# 基础设施告警规则
# 关联: docs/observability/08-alert-design.md §5
# 验证: promtool check rules deploy/observability/prometheus-rules/infrastructure.yaml

groups:
  - name: infrastructure-alerts
    interval: 30s
    rules:
      # ===== 节点基础 =====
      - alert: NodeUnreachable
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          domain: infrastructure
          team: sre
        annotations:
          summary: "节点 {{ $labels.instance }} 失联"
          impact: "该节点上所有 Pod 无法被调度 / 健康检查"
          runbook: |
            1. SSH 节点检查 dmesg / K3s agent
            2. 检查磁盘 / 内存
            3. 必要时 kubectl drain

      - alert: NodeCPUHigh
        expr: |
          (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 85
        for: 10m
        labels:
          severity: warning
          domain: infrastructure
          team: sre
        annotations:
          summary: "节点 {{ $labels.instance }} CPU {{ printf \"%.1f\" $value }}%"
          runbook: "查看 10-Infrastructure Top 进程"

      - alert: NodeCPUCritical
        expr: |
          (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 95
        for: 2m
        labels:
          severity: critical
          domain: infrastructure
          team: sre
        annotations:
          summary: "节点 {{ $labels.instance }} CPU {{ printf \"%.1f\" $value }}%"
          impact: "Pod 调度困难 / 业务延迟升高"

      - alert: NodeMemoryHigh
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          domain: infrastructure
          team: sre
        annotations:
          summary: "节点 {{ $labels.instance }} 内存 {{ printf \"%.1f\" $value }}%"
          runbook: |
            1. 查看 dmesg OOM
            2. 评估驱逐
            3. 横向扩容

      - alert: NodeDiskCritical
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 95
        for: 5m
        labels:
          severity: critical
          domain: infrastructure
          team: sre
        annotations:
          summary: "节点 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} {{ printf \"%.1f\" $value }}%"
          impact: "K3s 可能驱逐 Pod，PG 可能 crash"
          runbook: |
            1. 清理容器日志 / docker system prune
            2. 评估扩容
            3. 通知用户

      - alert: NodeDiskFillingFast
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 7 * 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
          domain: infrastructure
          team: sre
        annotations:
          summary: "节点 {{ $labels.instance }} 磁盘 7 天后将满"

      # ===== K3s 控制面 =====
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          domain: kubernetes
          team: sre
        annotations:
          summary: "K8s 节点 {{ $labels.node }} NotReady"
          runbook: "1. SSH 节点 2. 检查 K3s agent 3. 必要时 drain"

      - alert: KubePodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[10m]) * 60 * 5 > 0
        for: 10m
        labels:
          severity: warning
          domain: kubernetes
          team: sre
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 持续重启"

      - alert: KubeDeploymentReplicasUnavailable
        expr: |
          (kube_deployment_status_replicas_unavailable
            / kube_deployment_spec_replicas) > 0.5
        for: 5m
        labels:
          severity: warning
          domain: kubernetes
          team: sre
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 副本不足 50%"

      - alert: KubeStatefulSetReplicasUnavailable
        expr: |
          (kube_statefulset_status_replicas_unavailable
            / kube_statefulset_spec_replicas) > 0.5
        for: 5m
        labels:
          severity: critical
          domain: kubernetes
          team: sre
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} 副本不足"
          impact: "PG / pgbouncer 不可用"

      # ===== OTel Collector 自监控 =====
      - alert: OtelCollectorQueueFull
        expr: |
          otelcol_exporter_queue_size > 5000
        for: 2m
        labels:
          severity: warning
          domain: observability
          team: sre
        annotations:
          summary: "OTel Collector {{ $labels.exporter }} 队列积压"

      - alert: OtelExporterFailed
        expr: |
          rate(otelcol_exporter_send_failed_metric_points_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          domain: observability
          team: sre
        annotations:
          summary: "OTel 导出 metric 失败"

      - alert: OtelReceiverRefusing
        expr: |
          rate(otelcol_receiver_refused_metric_points_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          domain: observability
          team: sre
        annotations:
          summary: "OTel receiver 拒绝 metric"

      # ===== Cardinality 防御 (修订 2) =====
      - alert: PrometheusHighCardinality
        expr: |
          count by (__name__) ({__name__=~".+"}) > 10000
        for: 10m
        labels:
          severity: warning
          domain: observability
          team: sre
        annotations:
          summary: "Metric {{ $labels.__name__ }} cardinality > 10k"
          runbook: |
            1. 检查业务代码: 是否新加 label 无界
            2. 检查 OTel Collector: limit 配置
            3. 重启 Prometheus 强制重载
