# SLO 告警规则 (Google SRE Workbook Multi-Window Burn Rate)
# 关联: docs/observability/09-slo-design.md §5

groups:
  # ===== SLO Recording Rules =====
  - name: slo-recording
    interval: 30s
    rules:
      # 5m SLI 比率 (error / total)
      - record: slo:sli_error:ratio_5m
        expr: |
          sum by (slo) (rate(slo_error_events_total[5m]))
            / on(slo) group_left
          sum by (slo) (rate(slo_total_events_total[5m]))

      # 多窗口 burn rate
      - record: slo:sli_error:ratio_rate1h
        expr: slo:sli_error:ratio_5m

      - record: slo:sli_error:ratio_rate6h
        expr: |
          sum_over_time(slo:sli_error:ratio_5m[6h]) / 720

      - record: slo:sli_error:ratio_rate24h
        expr: |
          sum_over_time(slo:sli_error:ratio_5m[24h]) / 2880

      - record: slo:sli_error:ratio_rate3d
        expr: |
          sum_over_time(slo:sli_error:ratio_5m[3d]) / 8640

      # 30d 燃烧 (0 = 预算充足, 1 = 预算耗尽)
      - record: slo:current_burn_rate_30d
        expr: |
          (
            1 - (
              sum by (slo) (increase(slo_success_events_total[30d]))
              /
              sum by (slo) (increase(slo_total_events_total[30d]))
            )
          ) / (1 - on(slo) slo_info_target)

      # 错误预算剩余 (%)
      - record: slo:budget_remaining_ratio
        expr: |
          1 - slo:current_burn_rate_30d

  # ===== SLO 告警 =====
  - name: slo-alerts
    interval: 30s
    rules:
      # === Page: 1h + 6h 双窗口 (1h 14.4x, 6h 6x) ===
      - alert: SLO_Availability_Page
        expr: |
          (
            max by (slo) (slo:sli_error:ratio_rate1h{slo=~"api-.*"}) > (14.4 * 0.001)
            and
            max by (slo) (slo:sli_error:ratio_rate6h{slo=~"api-.*"}) > (6 * 0.001)
          )
        for: 2m
        labels:
          severity: critical
          domain: slo
          team: sre-slo
        annotations:
          summary: "SLO {{ $labels.slo }} Page: 1h+6h 预算燃烧"
          impact: "30d 错误预算加速消耗"
          runbook: "查看 90-SLO Burn Rate 面板"

      # === Page: 1h + 6h for git-push (99.5% SLO) ===
      - alert: SLO_GitPush_Page
        expr: |
          (
            max by (slo) (slo:sli_error:ratio_rate1h{slo="git-push-success"}) > (14.4 * 0.005)
            and
            max by (slo) (slo:sli_error:ratio_rate6h{slo="git-push-success"}) > (6 * 0.005)
          )
        for: 2m
        labels:
          severity: critical
          domain: slo
          team: sre-mw
        annotations:
          summary: "SLO git-push 1h+6h 燃烧"

      # === Ticket: 24h + 3d 双窗口 (1x 慢烧) ===
      - alert: SLO_Availability_Ticket
        expr: |
          (
            max by (slo) (slo:sli_error:ratio_rate24h{slo=~"api-.*"}) > 0.001
            and
            max by (slo) (slo:sli_error:ratio_rate3d{slo=~"api-.*"}) > 0.001
          )
        for: 30m
        labels:
          severity: warning
          domain: slo
          team: sre-slo
        annotations:
          summary: "SLO {{ $labels.slo }} Ticket: 24h+3d 慢烧"
          runbook: "周会讨论根因"

      # === 预算耗尽 ===
      - alert: SLO_Budget_Exhausted
        expr: slo:current_burn_rate_30d{slo=~"api-.*"} >= 1.0
        for: 5m
        labels:
          severity: critical
          domain: slo
          team: sre-slo
        annotations:
          summary: "SLO {{ $labels.slo }} 30d 预算耗尽"
          impact: "需启动 SLO 治理"
          runbook: |
            1. 召集 PM + SRE + Tech Lead
            2. 启动 incident
            3. 冻结非关键变更

      # === 预算 < 10% (即将耗尽) ===
      - alert: SLO_Budget_Low
        expr: slo:budget_remaining_ratio{slo=~"api-.*"} < 0.1
        for: 30m
        labels:
          severity: warning
          domain: slo
          team: sre-slo
        annotations:
          summary: "SLO {{ $labels.slo }} 30d 预算剩余 < 10%"

      # === SLO 100% 不可妥协 (审计 / 凭证) ===
      - alert: SLO_AuditChainBroken
        expr: slo:sli_error:ratio_5m{slo="audit-chain-integrity"} > 0
        for: 1m
        labels:
          severity: critical
          domain: security
          team: sec-oncall
          compliance: "true"
        annotations:
          summary: "SLO audit-chain-integrity 失败"
          runbook: "立即启动 forensic 模式"

      - alert: SLO_SecretsRotationFailure
        expr: slo:sli_error:ratio_5m{slo="secrets-rotation"} > 0
        for: 1h
        labels:
          severity: warning
          domain: security
          team: sec-oncall
        annotations:
          summary: "SLO secrets-rotation 失败"
