# 拒绝所有 + 显式允许白名单
# 关联: docs/observability/10-security-design.md §6

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default-deny
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 允许 DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-dns-allow
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# OTel Collector 接收业务 OTLP
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: gitgit
      ports:
        - port: 4317   # OTLP gRPC
        - port: 4318   # OTLP HTTP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
      ports:
        - port: 4317
        - port: 4318
---
# OTel Collector 出口（只允许到后端 + 业务）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
    - to:
        - podSelector:
            matchLabels:
              app: loki
      ports:
        - port: 3100
    - to:
        - podSelector:
            matchLabels:
              app: tempo
      ports:
        - port: 4317
        - port: 4318
        - port: 9411
        - port: 14250
        - port: 14268
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 9093
    - to:
        - podSelector:
            matchLabels:
              app: pg-exporter
      ports:
        - port: 9187
    - to:
        - podSelector:
            matchLabels:
              app: kube-state-metrics
      ports:
        - port: 8080
---
# Grafana 入口（仅 ingress-nginx）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 3000
---
# Prometheus 入口（仅 OTel Collector + 自身）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
      ports:
        - port: 9090
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 9090
    - from:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 9090
---
# Loki 入口
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
      ports:
        - port: 3100
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 3100
---
# Tempo 入口
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
      ports:
        - port: 4317
        - port: 4318
        - port: 9411
        - port: 3200
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 3200
