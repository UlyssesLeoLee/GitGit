# Alertmanager 配置
# 关联: docs/observability/08-alert-design.md §8 / 10-security-design.md §3
# 部署: 3 副本 (gossip 集群)

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 路由
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # critical
    - matchers:
        - severity = "critical"
      receiver: 'pagerduty'
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      continue: true

    # high
    - matchers:
        - severity = "high"
      receiver: 'slack-high'
      group_wait: 30s

    # warning
    - matchers:
        - severity = "warning"
      receiver: 'slack-warning'
      group_wait: 1m

    # info
    - matchers:
        - severity = "info"
      receiver: 'slack-info'
      group_wait: 5m

    # compliance (覆盖)
    - matchers:
        - compliance = "true"
      receiver: 'compliance-pager'
      group_wait: 5s

# 抑制
inhibit_rules:
  # critical 抑制同节点上所有 high
  - source_matchers:
      - severity = "critical"
      - domain = "infrastructure"
    target_matchers:
      - severity =~ "high|warning"
    equal: ['instance']

  # PG Primary down 抑制所有 DB 业务告警
  - source_match:
      alertname: 'PostgresDown'
    target_matchers:
      - domain = "database"
    equal: ['cluster']

  # K3s 节点不可达抑制 Pod 告警
  - source_match:
      alertname: 'KubeNodeNotReady'
    target_matchers:
      - alertname =~ 'KubePod.*'
    equal: ['node']

  # Critical SLO 抑制 Ticket
  - source_match:
      alertname: 'SLO_.*Page'
    target_match:
      alertname: 'SLO_.*Ticket'

# 接收器
receivers:
  - name: 'default'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/.../default'
        channel: '#alerts-default'
        title: '{{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: 'PD_SERVICE_KEY_PLACEHOLDER'
        description: '{{ .CommonLabels.alertname }} - {{ .CommonAnnotations.summary }}'
        details:
          runbook: '{{ .CommonAnnotations.runbook }}'
          dashboard: '{{ .CommonAnnotations.dashboard }}'
          severity: '{{ .CommonLabels.severity }}'
          slo: '{{ .CommonLabels.slo }}'

  - name: 'slack-high'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/.../high'
        channel: '#alerts-high'
        title: '[HIGH] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          *Impact:* {{ .Annotations.impact }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true

  - name: 'slack-warning'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/.../warning'
        channel: '#alerts-warning'
        title: '[WARN] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ end }}
        send_resolved: true

  - name: 'slack-info'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/.../info'
        channel: '#ops-info'
        title: '[INFO] {{ .CommonLabels.alertname }}'
        send_resolved: true

  - name: 'compliance-pager'
    pagerduty_configs:
      - service_key: 'PD_COMPLIANCE_KEY_PLACEHOLDER'
        description: 'COMPLIANCE: {{ .CommonLabels.alertname }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/.../compliance'
        channel: '#compliance-incidents'
        title: '[COMPLIANCE] {{ .CommonLabels.alertname }}'
        send_resolved: true

# 静默
silences:
