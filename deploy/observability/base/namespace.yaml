# observability namespace + ResourceQuota + PodSecurity
# 关联: docs/observability/11-deployment-design.md §2

apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    name: observability
    purpose: monitoring
    workload-class: observability
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 24Gi
    limits.cpu: "20"
    limits.memory: 64Gi
    persistentvolumeclaims: "20"
    requests.storage: 2Ti
    services: "30"
    secrets: "50"
    configmaps: "50"
---
# LimitRange 默认限制
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-default
  namespace: observability
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 4
        memory: 8Gi
