# Grafana 主配置
# 关联: docs/observability/10-security-design.md §2 / 11-deployment-design.md

[paths]
data = /var/lib/grafana/data
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_port = 3000
domain = grafana.example.com
root_url = https://grafana.example.com

[security]
admin_user = ${GF_SECURITY_ADMIN_USER__FILE}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD__FILE}
secret_key = ${GF_SECURITY_SECRET_KEY__FILE}
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
strict_transport_security = true
strict_transport_security_max_age_seconds = 31536000
strict_transport_security_include_subdomains = true
strict_transport_security_preload = true
content_security_policy = true
content_security_policy_template = "script-src 'self' 'unsafe-eval' 'unsafe-inline'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-ancestors 'self';"

[auth]
# 强制 OIDC
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
auto_assign_org_role = Viewer
default_theme = dark

[auth.generic_oauth]
enabled = true
name = GitGit
client_id = ${GF_AUTH_GOOGLE_CLIENT_ID}
client_secret = ${GF_AUTH_GOOGLE_CLIENT_SECRET}
auth_url = https://auth.example.com/oauth/authorize
token_url = https://auth.example.com/oauth/token
api_url = https://auth.example.com/oauth/userinfo
role_attribute_path = role
role_attribute_strict = true
allow_assign_grafana_admin = false
scopes = openid profile email groups
empty_scopes = false
tls_skip_verify_insecure_skip_verify = false

[log]
level = info
mode = console
filters = grafana.data_source.*:debug,grafana.dashboard.*:debug,grafana.user.*:debug

[dashboards]
min_refresh_interval = 10s
default_home_dashboard_path = /var/lib/grafana/dashboards/00-system.json

[unified_alerting]
enabled = true
execute_alerts = true
alertmanager_config = /etc/grafana/provisioning/alerting/alertmanager.yaml

[metrics]
enabled = true
basic_auth_username = ${GF_METRICS_BASIC_AUTH_USERNAME}
basic_auth_password = ${GF_METRICS_BASIC_AUTH_PASSWORD}
interval_seconds = 60

[analytics]
reporting_enabled = false
check_for_updates = false

[panels]
enable_alpha = false
disable_sanitize_html = false

[plugins]
enable_github = false
