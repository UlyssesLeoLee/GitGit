# Grafana DataSource Provisioning
# 关联: docs/observability/07-dashboard-design.md §14

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus.observability.svc:9090
    isDefault: true
    version: 1
    editable: false
    jsonData:
      timeInterval: '15s'
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.55.0
      cacheLevel: High
      queryTimeout: 60s
      incrementalQuerying: true
      disableMetricsLookup: false
    secureJsonData:
      # mTLS (如有)
      tlsCACert: ''
      tlsClientCert: ''
      tlsClientKey: ''

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    orgId: 1
    url: http://loki.observability.svc:3100
    version: 1
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: 'tenant-gitgit'

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    orgId: 1
    url: http://tempo.observability.svc:3200
    version: 1
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        filterBySpanID: true
        filterByTraceID: true
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      traceQuery:
        queryType: traceql
        spanStartTimeShift: '1h'
        spanEndTimeShift: '-1h'
