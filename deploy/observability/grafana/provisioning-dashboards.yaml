# Grafana Dashboard Provisioning Provider
# 关联: docs/observability/07-dashboard-design.md §14.2
# 强约束: allowUiUpdates: false (禁止 UI 编辑漂移)

apiVersion: 1

providers:
  - name: gitgit-dashboards
    orgId: 1
    folder: GitGit
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
      # 9 大盘子目录映射
      subType: file
